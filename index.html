<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذكرياتنا ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#5b3a48;text-align:center}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,#fff 0 1.5px,transparent 2px),
    radial-gradient(circle at 78% 12%,#fff 0 1.3px,transparent 2px),
    radial-gradient(circle at 40% 72%,#fff 0 1.4px,transparent 2px),
    radial-gradient(circle at 90% 70%,#fff 0 1.2px,transparent 2px),
    linear-gradient(135deg,#ffdce8 0%,#f8c7da 48%,#ffe9f1 100%);
  background-size:150px 150px,190px 190px,230px 230px,170px 170px,100% 100%;
  overflow-x:hidden;
}
body:before,body:after{content:'✦  ✧  ⋆  ✦  ✧  ⋆  ✦  ✧';position:fixed;inset:0;pointer-events:none;color:#fff8;font-size:20px;letter-spacing:22px;line-height:80px;z-index:0;animation:twinkle 3s ease-in-out infinite}
body:after{transform:translateY(35px);opacity:.5;animation-delay:1.4s}
.box{position:relative;z-index:1;width:92%;max-width:560px;margin:6vh auto;background:#fff8;padding:28px;border-radius:28px;backdrop-filter:blur(12px);box-shadow:0 15px 40px #b85c7a33;border:1px solid #fff9}
.emoji{font-size:58px}.memory{display:none}.memory .box{margin-top:5vh;background:#fff9}
h1{color:#a84d70;margin:10px 0 8px}p{color:#805466}
input,textarea,button{width:100%;padding:14px;margin-top:8px;border:1px solid #f0c4d4;border-radius:14px;font-size:16px;font-family:inherit}
.field{margin-top:12px;text-align:right}.field label{display:block;color:#a84d70;font-weight:bold;font-size:15px;margin:0 8px 6px}
input,textarea{background:#fff;color:#5b3a48;outline:none}input:focus,textarea:focus{border-color:#d783a5;box-shadow:0 0 0 3px #d783a522}
textarea{height:110px;resize:none}button{background:#b95f82;color:#fff;border:0;font-weight:bold;cursor:pointer;box-shadow:0 8px 18px #b95f8230}
button:disabled{opacity:.6;cursor:not-allowed}.heart{font-size:52px;animation:beat 1s infinite;margin:4px auto 8px}
.message{font-size:20px;line-height:1.9;margin:20px 0;white-space:pre-wrap;color:#67404f}
.dates{display:grid;gap:10px;margin:18px 0}.date-card{background:#fff9;border-radius:18px;padding:12px;border:1px solid #f1cbd9}.date-card b{display:block;color:#a84d70;margin-bottom:4px}

.heart-eyes{font-size:62px;margin:6px auto 4px;animation:floatEmoji 2s ease-in-out infinite}
@keyframes floatEmoji{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.06)}}
.floating-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floating-heart{position:absolute;bottom:-50px;font-size:22px;opacity:.7;animation:riseHeart linear infinite}
@keyframes riseHeart{from{transform:translateY(0) rotate(0deg);opacity:0}15%{opacity:.7}85%{opacity:.55}to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.flower-overlay{position:fixed;inset:0;background:#ffd9eaf2;display:none;align-items:center;justify-content:center;z-index:100;pointer-events:none}
.flower-overlay.show{display:flex;animation:flowerFade 3s ease forwards}
.flower-burst{font-size:clamp(110px,35vw,260px);filter:drop-shadow(0 15px 25px #a84d7050);animation:flowerPop 3s ease forwards}
@keyframes flowerPop{0%{transform:scale(.2) rotate(-20deg);opacity:0}18%{transform:scale(1.15) rotate(5deg);opacity:1}75%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes flowerFade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.photo-caption{margin-top:6px;width:100%;padding:9px 10px;border-radius:12px;font-size:14px}
.photo-caption-wrap{margin-bottom:2px}
.photo-caption-display{margin-top:-8px;margin-bottom:2px;padding:8px 12px;background:#fff8;border-radius:14px;color:#795061;font-size:16px;line-height:1.7}
.gallery{display:flex;flex-direction:column;gap:18px;margin:22px 0}.gallery img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;border-radius:22px;box-shadow:0 10px 26px #a74e6b24;border:4px solid #fff;cursor:zoom-in}
.photo-picker{display:block;border:2px dashed #d98aaa;background:#fff8fB;color:#a84d70;border-radius:20px;padding:18px 14px;margin-top:14px;cursor:pointer;font-weight:bold;font-size:17px;transition:.2s}
.photo-picker:hover{transform:translateY(-1px);background:#fff}
.photo-picker input{display:none}
.photo-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.preview-item{position:relative}.preview-item img{width:100%;height:110px;object-fit:cover;border-radius:14px;border:3px solid #fff;box-shadow:0 5px 14px #a74e6b22}
.preview-item button{position:absolute;top:4px;right:4px;width:30px;height:30px;padding:0;border-radius:50%;background:#fff;color:#a84d70;border:1px solid #f0c7d6;font-size:16px;box-shadow:0 3px 8px #0002}
.lightbox{position:fixed;inset:0;background:#2a1620e8;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:18px;box-shadow:0 15px 50px #0008}
.lightbox button{position:absolute;background:#fff;color:#8d4562;border:0;width:44px;height:44px;padding:0;border-radius:50%;font-size:24px;z-index:51}
.lightbox-close{top:18px;right:18px}.lightbox-prev{left:18px}.lightbox-next{right:18px}
.music{margin:18px 0;padding:14px;background:#fff8;border-radius:18px;border:1px solid #f0c7d6}.music-title{font-weight:bold;color:#a84d70;margin-bottom:8px}.music audio{width:100%}
.float{position:fixed;bottom:-30px;font-size:25px;animation:up 5s linear forwards;pointer-events:none;z-index:2}.error{background:#ffe1e1;color:#8b0000;padding:12px;border-radius:12px;margin-top:12px;display:none}.loading{display:none;margin-top:15px;color:#a84d70}
.small-note{font-size:13px;color:#8d6474;margin-top:7px}
@keyframes beat{50%{transform:scale(1.16)}}@keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-110vh);opacity:0}}@keyframes twinkle{50%{opacity:.35}}
@media(max-width:430px){.box{padding:22px}.gallery img{max-height:520px}.message{font-size:18px}}

/* Romantic memory opening + pages */
.memory-shell{position:relative;overflow:hidden}
.roses{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rose{position:absolute;font-size:30px;animation:roseFloat 7s linear infinite;opacity:.8}
.rose:nth-child(1){left:8%;top:8%;animation-delay:0s}.rose:nth-child(2){left:82%;top:16%;animation-delay:1.5s}.rose:nth-child(3){left:18%;top:70%;animation-delay:3s}.rose:nth-child(4){left:78%;top:74%;animation-delay:4.5s}.rose:nth-child(5){left:47%;top:4%;animation-delay:2.5s}
@keyframes roseFloat{0%{transform:translateY(12px) rotate(-8deg);opacity:.15}30%{opacity:.8}100%{transform:translateY(-35px) rotate(12deg);opacity:.05}}
.envelope-wrap{text-align:center;margin:8px auto 18px}
.envelope{width:150px;height:100px;margin:auto;position:relative;background:linear-gradient(145deg,#fff,#ffe7f0);border:3px solid #d98aaa;border-radius:12px;box-shadow:0 12px 28px #9c4c6b26;cursor:pointer}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49%,#e8abc0 50%,transparent 51%),linear-gradient(225deg,transparent 49%,#e8abc0 50%,transparent 51%);border-radius:10px}
.envelope-heart{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:42px;z-index:2}
.unlock-title{font-size:25px;color:#9b4567;margin:8px 0}
.unlock-subtitle{color:#9b4567;margin:0 0 14px}
.timer-card{margin:16px 0;padding:18px 12px;border-radius:22px;background:linear-gradient(135deg,#fff,#fff2f7);border:2px solid #f0c4d5;box-shadow:0 8px 22px #a74e6b18}
.timer-title{color:#a84d70;font-weight:bold;font-size:18px;margin-bottom:12px}
.timer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}
.timer-unit{background:#fff;border-radius:16px;padding:9px 4px;border:1px solid #f1d1dd}
.timer-unit b{display:block;font-size:22px;color:#9d4d6c}
.timer-unit span{font-size:11px;color:#a86b82}
.memory-message{background:#fff9fc;border:1px solid #f1ccd9;border-radius:22px;padding:18px;margin:14px 0;color:#6f3b50;line-height:1.9;white-space:pre-wrap}
.next-btn{margin-top:12px;background:linear-gradient(135deg,#b75d82,#a94970)!important}
.memory-page-section{animation:pageIn .45s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

</style>
</head>
<body>

<div id="formPage" class="box">
  <div class="emoji">💗</div>
  <h1>اعمل ذكرى مميزة</h1>
  <p>املأ التفاصيل والصور وهنجهزلك رابط خاص للذكرى ✨</p>
  <input id="name" placeholder="اسم الشخص">
  <div class="field">
    <label for="date">🎂 تاريخ الميلاد</label>
    <input id="date" type="date">
  </div>
  <div class="field">
    <label for="relationshipStart">💕 تاريخ بداية العلاقة</label>
    <input id="relationshipStart" type="date">
  </div>
  <div class="field">
    <label for="firstMeeting">✨ أول يوم اتقابلتوا فيه</label>
    <input id="firstMeeting" type="date">
  </div>
  <textarea id="message" placeholder="اكتب رسالة جميلة..."></textarea>
  <div class="field">
    <label for="memoryPassword">🔐 كلمة سر الذكرى</label>
    <input id="memoryPassword" type="password" minlength="4" placeholder="اختار كلمة سر">
  </div>
  <label class="photo-picker">
    📸 إضافة صور للذكرى
    <input id="photo" type="file" accept="image/*" multiple>
  </label>
  <div id="photoCount" class="small-note">لم يتم اختيار صور بعد 📷</div>
  <div id="photoPreview" class="photo-preview"></div>
  <button id="createBtn" onclick="createMemory()">إنشاء الذكرى ✨</button>
  <div id="error" class="error"></div>
  <div id="loading" class="loading">جاري إنشاء الذكرى... ⏳</div>
</div>

<div id="memoryPage" class="memory">
  <div class="box"></div>
</div>

<div id="floatingHearts" class="floating-hearts" aria-hidden="true"></div>
<div id="flowerOverlay" class="flower-overlay" aria-hidden="true">
  <div class="flower-burst">🌹</div>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="إغلاق">✕</button>
  <button class="lightbox-prev" onclick="changeLightbox(-1)" aria-label="الصورة السابقة">‹</button>
  <img id="lightboxImg" src="" alt="صورة مكبرة">
  <button class="lightbox-next" onclick="changeLightbox(1)" aria-label="الصورة التالية">›</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://vivzjchvymlskwamiqcd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sqJWaioZ5ShIonsxEpgA5Q_cYMd3Hyi';
const BUCKET = 'memory-images';
const configured = !SUPABASE_URL.includes('ضع_') && !SUPABASE_ANON_KEY.includes('ضع_');
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
function showError(msg){ $('error').textContent=msg; $('error').style.display='block'; }
function clearError(){ $('error').style.display='none'; }
function formatDate(value){
  if(!value) return '—';
  const d=new Date(value+'T00:00:00');
  return d.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
}

let selectedFiles=[];
let lightboxUrls=[];
let lightboxIndex=0;

function renderPhotoPreview(){
  const wrap=$('photoPreview');
  wrap.innerHTML='';
  $('photoCount').textContent = selectedFiles.length
    ? `تم اختيار ${selectedFiles.length} ${selectedFiles.length===1?'صورة':'صور'} ❤️`
    : 'لم يتم اختيار صور بعد 📷';

  selectedFiles.forEach((file,index)=>{
    const item=document.createElement('div');
    item.className='preview-item';
    const img=document.createElement('img');
    img.src=URL.createObjectURL(file);
    img.alt=`معاينة الصورة ${index+1}`;
    const remove=document.createElement('button');
    remove.type='button';
    remove.textContent='✕';
    remove.onclick=()=>{
      selectedFiles.splice(index,1);
      renderPhotoPreview();
    };
    const captionWrap=document.createElement('div');
    captionWrap.className='photo-caption-wrap';
    const caption=document.createElement('input');
    caption.className='photo-caption';
    caption.type='text';
    caption.maxLength=120;
    caption.placeholder='اكتب كلام مع الصورة ❤️';
    caption.value=file.caption || '';
    caption.oninput=()=>{file.caption=caption.value;};
    captionWrap.appendChild(caption);
    item.append(img,remove,captionWrap);
    wrap.appendChild(item);
  });
}

$('photo').addEventListener('change',()=>{
  const incoming=Array.from($('photo').files || []);
  if(incoming.some(file=>!file.type.startsWith('image/'))){
    showError('اختار صور فقط.');
    return;
  }
  const merged=[...selectedFiles,...incoming];
  if(merged.length>10){showError('اختار لحد 10 صور فقط.');return;}
  if(merged.some(file=>file.size>5*1024*1024)){showError('كل صورة لازم تكون أقل من 5 ميجابايت.');return;}
  clearError();
  selectedFiles=merged;
  $('photo').value='';
  renderPhotoPreview();
});

function openLightbox(urls,index){
  lightboxUrls=urls; lightboxIndex=index;
  $('lightboxImg').src=lightboxUrls[lightboxIndex];
  $('lightbox').classList.add('open');
  $('lightbox').setAttribute('aria-hidden','false');
}
function closeLightbox(){
  $('lightbox').classList.remove('open');
  $('lightbox').setAttribute('aria-hidden','true');
  $('lightboxImg').src='';
}
function changeLightbox(step){
  if(!lightboxUrls.length)return;
  lightboxIndex=(lightboxIndex+step+lightboxUrls.length)%lightboxUrls.length;
  $('lightboxImg').src=lightboxUrls[lightboxIndex];
}
$('lightbox').addEventListener('click',(e)=>{if(e.target===$('lightbox'))closeLightbox();});
document.addEventListener('keydown',(e)=>{
  if(!$('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')changeLightbox(1);
  if(e.key==='ArrowRight')changeLightbox(-1);
});

async function sha256(text){
  const bytes=new TextEncoder().encode(text);
  const hash=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function createMemory(){
  clearError();
  if(!configured){showError('لازم تضيف بيانات Supabase في الملف أولًا.');return;}

  const name=$('name').value.trim();
  const date=$('date').value;
  const relationshipStart=$('relationshipStart').value;
  const firstMeeting=$('firstMeeting').value;
  const message=$('message').value.trim();
  const files=selectedFiles;
  const password=$('memoryPassword').value.trim();

  if(!name || !date){showError('اكتب الاسم وتاريخ الميلاد الأول ❤️');return;}
  if(password.length<4){showError('اكتب كلمة سر من 4 أحرف أو أرقام على الأقل 🔐');return;}

  $('createBtn').disabled=true;
  $('loading').style.display='block';

  try{
    const id=crypto.randomUUID();
    const photo_urls=[];

    for(let i=0;i<files.length;i++){
      const file=files[i];
      const ext=(file.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase() || 'jpg';
      const path=`${id}/${String(i+1).padStart(2,'0')}.${ext}`;
      const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
      if(uploadError) throw uploadError;
      photo_urls.push(supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
    }

    const {error}=await supabase.from('memories').insert({
      id,
      name,
      birthday:date,
      relationship_start:relationshipStart || null,
      first_meeting:firstMeeting || null,
      password_hash: await sha256(password),
      message:message || 'أتمنى لكم أيام جميلة وسعيدة مع بعض ❤️',
      photo_urls,
      photo_captions: files.map(file => (file.caption || '').trim()),
      photo_url:photo_urls[0] || null
    });
    if(error) throw error;

    const memoryUrl = `${location.origin}/m/${id}`;

    // نسخ رابط الذكرى تلقائيًا
    try{
      await navigator.clipboard.writeText(memoryUrl);
    }catch(e){
      console.log('تعذر النسخ التلقائي في هذا المتصفح');
    }

    location.href = memoryUrl;
  }catch(e){
    console.error(e);
    showError('حصل خطأ أثناء إنشاء الذكرى. تأكد إنك نفذت تعديل Supabase المطلوب ثم حاول مرة أخرى.');
  }finally{
    $('createBtn').disabled=false;
    $('loading').style.display='none';
  }
}


function startFloatingHearts(){
  const wrap=$('floatingHearts');
  if(!wrap || wrap.dataset.ready) return;
  wrap.dataset.ready='1';
  const hearts=['❤️','💕','💗','💖','💘','💓'];
  for(let i=0;i<18;i++){
    const h=document.createElement('span');
    h.className='floating-heart';
    h.textContent=hearts[i%hearts.length];
    h.style.left=(Math.random()*100)+'%';
    h.style.animationDuration=(7+Math.random()*8)+'s';
    h.style.animationDelay=(-Math.random()*12)+'s';
    h.style.fontSize=(16+Math.random()*18)+'px';
    wrap.appendChild(h);
  }
}
function showFlowerBurst(){
  const overlay=$('flowerOverlay');
  if(!overlay)return;
  overlay.classList.remove('show');
  void overlay.offsetWidth;
  overlay.classList.add('show');
  setTimeout(()=>overlay.classList.remove('show'),3000);
}
startFloatingHearts();

async function loadMemory(id){
  if(!configured){return;}
  try{
    const {data,error}=await supabase.from('memories')
      .select('name,birthday,relationship_start,first_meeting,message,photo_url,photo_urls,photo_captions,password_hash')
      .eq('id',id).single();
    if(error || !data) throw error || new Error('Not found');

    if(data.password_hash){
      $('formPage').style.display='none';
      $('memoryPage').style.display='block';
      $('memoryPage').querySelector('.box').innerHTML=`
        <div class="memory-shell">
          <div class="roses" aria-hidden="true">
            <div class="rose">🌹</div><div class="rose">🌹</div><div class="rose">🌷</div><div class="rose">🌹</div>
          </div>
          <div class="envelope-wrap">
            <div class="envelope"><div class="envelope-heart">💌</div></div>
          </div>
          <div class="unlock-title">رسالة خاصة ❤️</div>
          <div class="unlock-subtitle">الذكرى دي ليها كلمة سر</div>
          <input id="memoryUnlockPassword" type="password" placeholder="اكتب كلمة السر">
          <button id="unlockBtn">فتح الرسالة 🔓</button>
          <div id="unlockError" class="error"></div>
        </div>
      `;
      $('unlockBtn').onclick=async()=>{
        const hash=await sha256($('memoryUnlockPassword').value);
        if(hash!==data.password_hash){
          $('unlockError').textContent='كلمة السر غير صحيحة ❌';
          $('unlockError').style.display='block';
          return;
        }
        showFlowerBurst();
        setTimeout(()=>renderMemory(data),3000);
      };
      return;
    }
    renderMemory(data);
  }catch(e){
    $('formPage').style.display='none';
    $('memoryPage').style.display='block';
    $('memoryPage').querySelector('.box').innerHTML='<div class="heart">💔</div><h1>الذكرى مش موجودة</h1><p>اتأكد إن رابط الذكرى صحيح.</p>';
  }
}

function renderMemory(data){
  const box=$('memoryPage').querySelector('.box');
  const startDate=data.relationship_start || data.first_meeting || data.birthday;
  const safeName=(data.name || '').replace(/[<>&"]/g,'');
  box.innerHTML=`
    <div class="memory-shell">
      <div class="roses" aria-hidden="true">
        <div class="rose">🌹</div><div class="rose">🌹</div><div class="rose">🌹</div>
        <div class="rose">🌷</div><div class="rose">🌹</div>
      </div>
      <section id="memoryIntro" class="memory-page-section">
        <div class="envelope-wrap">
          <div class="envelope" title="رسالة حب">
            <div class="envelope-heart">💌</div>
          </div>
        </div>
        <div class="unlock-title">حبيبتي يا ${safeName} ❤️</div>
        <div class="unlock-subtitle">من يوم ما بدأت حكايتنا... والوقت ليه معنى تاني 🌹</div>

        <div class="timer-card">
          <div class="timer-title">⏳ بقالنا سوا</div>
          <div id="loveTimer" class="timer-grid">
            <div class="timer-unit"><b id="timerDays">0</b><span>يوم</span></div>
            <div class="timer-unit"><b id="timerHours">00</b><span>ساعة</span></div>
            <div class="timer-unit"><b id="timerMinutes">00</b><span>دقيقة</span></div>
            <div class="timer-unit"><b id="timerSeconds">00</b><span>ثانية</span></div>
          </div>
        </div>

        <div class="heart-eyes">😍</div><div class="memory-message" id="introMessage"></div>
        <button class="next-btn" onclick="showMemoryPage(2)">التالي ❤️</button>
      </section>

      <section id="memoryPage2" class="memory-page-section" style="display:none">
        <div class="heart">❤️</div>
        <h1>ذكرياتنا الجميلة</h1>
        <div class="dates">
          <div class="date-card"><b>🎂 تاريخ الميلاد</b><span id="showDate"></span></div>
          <div class="date-card"><b>💕 تاريخ بداية علاقتكم</b><span id="showRelationshipStart"></span></div>
          <div class="date-card"><b>✨ أول يوم اتقابلتوا فيه</b><span id="showFirstMeeting"></span></div>
        </div>

        <div class="music">
          <div class="music-title">🎵 الأغنية</div>
          <audio id="musicPlayer" controls loop preload="none">
            <source src="" type="audio/mpeg">
          </audio>
          <div class="small-note">أضف مصدرًا صوتيًا مرخّصًا للأغنية إذا كان لديك حق استخدامها. بعض المتصفحات تمنع التشغيل التلقائي.</div>
        </div>

        <div class="gallery" id="gallery"></div>
        <button onclick="sharePage()">🔗 نسخ ومشاركة الرابط</button>
      </section>
    </div>
  `;

  $('introMessage').textContent=data.message || 'أتمنى لكم أيام جميلة وسعيدة مع بعض ❤️';
  $('showDate').textContent=formatDate(data.birthday);
  $('showRelationshipStart').textContent=formatDate(data.relationship_start);
  $('showFirstMeeting').textContent=formatDate(data.first_meeting);

  startLoveTimer(startDate);

  const gallery=$('gallery');
  gallery.innerHTML='';
  let urls=Array.isArray(data.photo_urls) ? data.photo_urls.filter(Boolean) : [];
  if(!urls.length && data.photo_url) urls=[data.photo_url];
  lightboxUrls=urls;
  const captions=Array.isArray(data.photo_captions) ? data.photo_captions : [];
  urls.forEach((url,i)=>{
    const wrap=document.createElement('div');
    const img=document.createElement('img');
    img.src=url; img.alt=`صورة من الذكرى ${i+1}`; img.loading='lazy';
    img.onclick=()=>openLightbox(urls,i);
    wrap.appendChild(img);
    if(captions[i]){
      const cap=document.createElement('div');
      cap.className='photo-caption-display';
      cap.textContent=captions[i];
      wrap.appendChild(cap);
    }
    gallery.appendChild(wrap);
  });
}

let loveTimerInterval=null;
function startLoveTimer(value){
  if(loveTimerInterval) clearInterval(loveTimerInterval);
  const target=new Date((value || '')+'T00:00:00');
  if(isNaN(target.getTime())) return;
  const update=()=>{
    let diff=Math.max(0,Date.now()-target.getTime());
    const days=Math.floor(diff/86400000); diff%=86400000;
    const hours=Math.floor(diff/3600000); diff%=3600000;
    const mins=Math.floor(diff/60000); diff%=60000;
    const secs=Math.floor(diff/1000);
    if($('timerDays')){
      $('timerDays').textContent=days;
      $('timerHours').textContent=String(hours).padStart(2,'0');
      $('timerMinutes').textContent=String(mins).padStart(2,'0');
      $('timerSeconds').textContent=String(secs).padStart(2,'0');
    }
  };
  update();
  loveTimerInterval=setInterval(update,1000);
}
function showMemoryPage(page){
  if(page===2){
    $('memoryIntro').style.display='none';
    $('memoryPage2').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

async function sharePage(){
  const url=location.href;
  try{
    await navigator.clipboard.writeText(url);
    alert('تم نسخ رابط الذكرى 🔗❤️');
  }catch{
    if(navigator.share){try{await navigator.share({title:'ذكرى جميلة ❤️',text:'شوف الذكرى دي 🎂✨',url})}catch{} }
    else alert(url);
  }
}

function createHeart(){
  const h=document.createElement('div');h.className='float';
  h.textContent=['❤️','💖','💕','✨','💗'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'%';
  h.style.animationDuration=(3+Math.random()*4)+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),7000);
}
setInterval(createHeart,700);

window.createMemory=createMemory;
window.sharePage=sharePage;

if(match) loadMemory(match[1]);
