.count-box{background:linear-gradient(180deg,#21121a,#10080d)!important;border-color:#d7b56d2c!important;box-shadow:inset 0 1px #fff1!important}
.count-box strong{color:#f0d89a!important}.count-box span{color:#bda7ae!important}
.next-btn{background:linear-gradient(135deg,#c89b4f,#7e1838)!important;color:#fff5df!important;border:1px solid #e8c97877!important}
.music-dock{background:linear-gradient(135deg,#10070cef,#24101af5)!important;border-color:#d7b56d66!important;box-shadow:0 18px 55px #000c,0 0 35px #d7b56d10!important}
.music-dock .music-info b{color:#f0d89a!important}.music-dock .music-info span{color:#bda7ae!important}.music-dock .record{border-color:#d7b56dbb!important}
.gallery .photo-wrap{background:#070507!important;border-color:#d7b56d66!important;box-shadow:0 25px 65px #000b!important;transform:translateZ(0);transition:transform .25s ease,box-shadow .25s ease}
.gallery .photo-wrap:hover{transform:translateY(-3px);box-shadow:0 30px 75px #000c,0 0 28px #d7b56d10!important}
.gallery .photo-wrap img{border:0!important}
.gallery .photo-caption-display{font-family:Georgia,serif!important;color:#f7ead0!important;background:linear-gradient(180deg,#0a0508b8,#080406f2)!important;border-color:#d7b56d55!important}
.lightbox{background:#030204f7!important}.lightbox button{background:linear-gradient(145deg,#f1d99d,#b8944e)!important}
.photo-picker{background:#120a0f!important;border-color:#d7b56d66!important;color:#f0d89a!important}
.roses .rose{opacity:.55!important;filter:drop-shadow(0 8px 15px #0009) sepia(.3)}
@media(max-width:430px){#formPage h1{font-size:26px!important}.typewriter{font-size:16px!important;padding:14px!important}.music-dock{bottom:7px!important}}
</style>
</head>
<body>

<div id="formPage" class="box">
  <div class="emoji">💗</div>
  <h1>اعمل ذكرى مميزة</h1>
  <p>املأ التفاصيل والصور وهنجهزلك رابط خاص للذكرى ✨</p>
  <input id="name" placeholder="اسم الشخص">
  <div class="field">
    <label for="date">🎂 تاريخ الميلاد</label>
    <input id="date" type="date">
  </div>
  <div class="field">
    <label for="relationshipStart">💕 تاريخ بداية العلاقة</label>
    <input id="relationshipStart" type="date">
  </div>
  <div class="field">
    <label for="firstMeeting">✨ أول يوم اتقابلتوا فيه</label>
    <input id="firstMeeting" type="date">
  </div>
  <textarea id="message" placeholder="اكتب رسالة جميلة..."></textarea>
  <div class="field">
    <label for="firstMessage">💌 الرسالة الأولى</label>
    <textarea id="firstMessage" placeholder="اكتب الرسالة اللي هتظهر في البداية..."></textarea>
  </div>
  <div class="field">
    <label for="finalMessage">💖 الرسالة الأخيرة</label>
    <textarea id="finalMessage" placeholder="اكتب الرسالة اللي هتظهر في النهاية..."></textarea>
  </div>
  <div class="field">
    <label for="memoryPassword">🔐 كلمة سر الذكرى</label>
    <input id="memoryPassword" type="password" minlength="4" placeholder="اختار كلمة سر">
  </div>
  <label class="photo-picker">
    📸 إضافة صور للذكرى
    <input id="photo" type="file" accept="image/*" multiple>
  </label>
  <div id="photoCount" class="small-note">لم يتم اختيار صور بعد 📷</div>
  <div id="photoPreview" class="photo-preview"></div>
  <div id="photoCaptions"></div>
  <button id="createBtn" onclick="createMemory()">إنشاء الذكرى ✨</button>
  <div id="error" class="error"></div>
  <div id="loading" class="loading">جاري إنشاء الذكرى... ⏳</div>
</div>

<div id="memoryPage" class="memory">
  <div class="box"></div>
</div>

<div id="floatingHearts" class="floating-hearts" aria-hidden="true"></div>
<div id="flowerOverlay" class="flower-overlay" aria-hidden="true">
  <div class="flower-burst">🌹</div>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="إغلاق">✕</button>
  <button class="lightbox-prev" onclick="changeLightbox(-1)" aria-label="الصورة السابقة">‹</button>
  <img id="lightboxImg" src="" alt="صورة مكبرة">
  <button class="lightbox-next" onclick="changeLightbox(1)" aria-label="الصورة التالية">›</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://vivzjchvymlskwamiqcd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sqJWaioZ5ShIonsxEpgA5Q_cYMd3Hyi';
const BUCKET = 'memory-images';
const configured = !SUPABASE_URL.includes('ضع_') && !SUPABASE_ANON_KEY.includes('ضع_');
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
function showError(msg){ $('error').textContent=msg; $('error').style.display='block'; }
function clearError(){ $('error').style.display='none'; }
function formatDate(value){
  if(!value) return '—';
  const d=new Date(value+'T00:00:00');
  return d.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
}

let selectedFiles=[];
let lightboxUrls=[];
let lightboxIndex=0;

function renderPhotoPreview(){
  const wrap=$('photoPreview');
  wrap.innerHTML='';
  const caps=$('photoCaptions');
  if(caps) caps.innerHTML='';
  $('photoCount').textContent = selectedFiles.length
    ? `تم اختيار ${selectedFiles.length} ${selectedFiles.length===1?'صورة':'صور'} ❤️`
    : 'لم يتم اختيار صور بعد 📷';

  selectedFiles.forEach((file,index)=>{
    const item=document.createElement('div');
    item.className='preview-item';
    const img=document.createElement('img');
    img.src=URL.createObjectURL(file);
    img.alt=`معاينة الصورة ${index+1}`;
    const remove=document.createElement('button');
    remove.type='button';
    remove.textContent='✕';
    remove.onclick=()=>{
      selectedFiles.splice(index,1);
      renderPhotoPreview();
    };
    const captionWrap=document.createElement('div');
    captionWrap.className='photo-caption-wrap';
    const caption=document.createElement('input');
    caption.className='photo-caption';
    caption.type='text';
    caption.maxLength=120;
    caption.placeholder='اكتب كلام مع الصورة ❤️';
    caption.value=file.caption || '';
    caption.oninput=()=>{file.caption=caption.value;};
    captionWrap.appendChild(caption);
    item.append(img,remove,captionWrap);
    wrap.appendChild(item);
    if(caps){
      const f=document.createElement('div'); f.className='caption-field';
      f.innerHTML=`<input id="caption_${index}" placeholder="اكتب كلام للصورة ${index+1} ❤️">`;
      caps.appendChild(f);
    }
  });
}

$('photo').addEventListener('change',()=>{
  const incoming=Array.from($('photo').files || []);
  if(incoming.some(file=>!file.type.startsWith('image/'))){
    showError('اختار صور فقط.');
    return;
  }
  const merged=[...selectedFiles,...incoming];
  if(merged.length>10){showError('اختار لحد 10 صور فقط.');return;}
  if(merged.some(file=>file.size>5*1024*1024)){showError('كل صورة لازم تكون أقل من 5 ميجابايت.');return;}
  clearError();
  selectedFiles=merged;
  $('photo').value='';
  renderPhotoPreview();
});

function openLightbox(urls,index){
  lightboxUrls=urls; lightboxIndex=index;
  $('lightboxImg').src=lightboxUrls[lightboxIndex];
  $('lightbox').classList.add('open');
  $('lightbox').setAttribute('aria-hidden','false');
}
function closeLightbox(){
  $('lightbox').classList.remove('open');
  $('lightbox').setAttribute('aria-hidden','true');
  $('lightboxImg').src='';
}
function changeLightbox(step){
  if(!lightboxUrls.length)return;
  lightboxIndex=(lightboxIndex+step+lightboxUrls.length)%lightboxUrls.length;
  $('lightboxImg').src=lightboxUrls[lightboxIndex];
}
$('lightbox').addEventListener('click',(e)=>{if(e.target===$('lightbox'))closeLightbox();});
$('lightbox').querySelector('.lightbox-close').addEventListener('click',e=>{e.stopPropagation();closeLightbox()});
$('lightbox').querySelector('.lightbox-prev').addEventListener('click',e=>{e.stopPropagation();changeLightbox(-1)});
$('lightbox').querySelector('.lightbox-next').addEventListener('click',e=>{e.stopPropagation();changeLightbox(1)});
let touchStartX=0;
$('lightbox').addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});
$('lightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>45)changeLightbox(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',(e)=>{
  if(!$('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')changeLightbox(-1);
  if(e.key==='ArrowRight')changeLightbox(1);
});

async function sha256(text){
  const bytes=new TextEncoder().encode(text);
  const hash=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}


function createFlowerEffect(){
  const overlay=$('flowerOverlay');
  if(!overlay) return;
  overlay.classList.remove('show');
  void overlay.offsetWidth;
  overlay.classList.add('show');
  setTimeout(()=>{
    overlay.classList.remove('show');
    overlay.style.display='none';
  },3000);
}
function startHeartRain(){
  const rain=document.createElement('div'); rain.className='heart-rain';
  const hearts=['❤️','💕','💗','💖','💞'];
  for(let i=0;i<32;i++){
    const h=document.createElement('span');
    h.textContent=hearts[i%hearts.length];
    h.style.left=(Math.random()*100)+'%';
    h.style.animationDuration=(4+Math.random()*5)+'s';
    h.style.animationDelay=(Math.random()*3)+'s';
    rain.appendChild(h);
  }
  document.body.appendChild(rain);
  setTimeout(()=>rain.remove(),12000);
}
function showCopied(){
  const toast=document.createElement('div');
  toast.textContent='✅ تم نسخ رابط الذكرى';
  toast.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff;color:#a84d70;padding:13px 20px;border-radius:30px;box-shadow:0 8px 25px #0002;z-index:200;font-weight:bold';
  document.body.appendChild(toast); setTimeout(()=>toast.remove(),2200);
}
async function createMemory(){
  clearError();
  if(!configured){showError('لازم تضيف بيانات Supabase في الملف أولًا.');return;}

  const name=$('name').value.trim();
  const date=$('date').value;
  const relationshipStart=$('relationshipStart').value;
  const firstMeeting=$('firstMeeting').value;
  const message=$('message').value.trim();
  const files=selectedFiles;
  const password=$('memoryPassword').value.trim();
  const firstMessage=$('firstMessage')?.value.trim() || '';
  const finalMessage=$('finalMessage')?.value.trim() || '';

  if(!name || !date){showError('اكتب الاسم وتاريخ الميلاد الأول ❤️');return;}
  if(password.length<4){showError('اكتب كلمة سر من 4 أحرف أو أرقام على الأقل 🔐');return;}

  $('createBtn').disabled=true;
  $('loading').style.display='block';

  try{
    const id=crypto.randomUUID();
    const photo_urls=[];

    for(let i=0;i<files.length;i++){
      const file=files[i];
      const ext=(file.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase() || 'jpg';
      const path=`${id}/${String(i+1).padStart(2,'0')}.${ext}`;
      const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
      if(uploadError) throw uploadError;
      photo_urls.push(supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
    }

    const {error}=await supabase.from('memories').insert({
      id,
      name,
      birthday:date,
      relationship_start:relationshipStart || null,
      first_meeting:firstMeeting || null,
      password_hash: await sha256(password),
      message:firstMessage || message || '😍 أجمل حاجة حصلتلي إنك بقيتي جزء من حياتي ❤️',
      final_message:finalMessage || 'وإن شاء الله دي مش نهاية الذكريات… دي بداية لأيام أحلى كتير ❤️',
      photo_urls,
      photo_captions: files.map(file => (file.caption || '').trim()),
      photo_url:photo_urls[0] || null
    });
    if(error) throw error;

    const memoryUrl = `${location.origin}/?memory=${encodeURIComponent(id)}`;

    // نسخ رابط الذكرى تلقائيًا
    try{
      await navigator.clipboard.writeText(memoryUrl);
    }catch(e){
      console.log('تعذر النسخ التلقائي في هذا المتصفح');
    }

    location.href = memoryUrl;
  }catch(e){
    console.error(e);
    showError('حصل خطأ أثناء إنشاء الذكرى. تأكد إنك نفذت تعديل Supabase المطلوب ثم حاول مرة أخرى.');
  }finally{
    $('createBtn').disabled=false;
    $('loading').style.display='none';
  }
}


function startFloatingHearts(){
  const wrap=$('floatingHearts');
  if(!wrap || wrap.dataset.ready) return;
  wrap.dataset.ready='1';
  const hearts=['❤️','💕','💗','💖','💘','💓'];
  for(let i=0;i<18;i++){
    const h=document.createElement('span');
    h.className='floating-heart';
    h.textContent=hearts[i%hearts.length];
    h.style.left=(Math.random()*100)+'%';
    h.style.animationDuration=(7+Math.random()*8)+'s';
    h.style.animationDelay=(-Math.random()*12)+'s';
    h.style.fontSize=(16+Math.random()*18)+'px';
    wrap.appendChild(h);
  }
}
function showFlowerBurst(){
  const overlay=$('flowerOverlay');
  if(!overlay)return;
  overlay.classList.remove('show');
  void overlay.offsetWidth;
  overlay.classList.add('show');
  setTimeout(()=>overlay.classList.remove('show'),3000);
}
startFloatingHearts();

async function loadMemory(id){
  if(!configured)return;
  try{
    const {data,error}=await supabase.from('memories')
      .select('name,birthday,relationship_start,first_meeting,message,final_message,photo_url,photo_urls,photo_captions,password_hash')
      .eq('id',id).single();
    if(error||!data)throw error||new Error('Not found');

    $('formPage').style.display='none';
    $('memoryPage').style.display='block';
    $('memoryPage').innerHTML=`<div class="box" id="unlockBox">
      <div class="envelope">💌</div>
      <h1>ذكرى خاصة ❤️</h1>
      <p>اكتب كلمة السر لفتح الذكرى</p>
      <input id="memoryUnlockPassword" type="password" placeholder="كلمة السر">
      <button id="unlockBtn">🔓 فتح الذكرى</button>
      <div id="unlockError" class="error"></div>
    </div>`;

    $('unlockBtn').onclick=async()=>{
      const hash=await sha256($('memoryUnlockPassword').value);
      if(data.password_hash && hash!==data.password_hash){
        $('unlockError').textContent='كلمة السر غير صحيحة ❌'; $('unlockError').style.display='block'; return;
      }
      renderMemoryFlow(data);
      startHeartRain();
      try{ createFlowerEffect(); }catch(e){ console.error('flower effect:',e); }
      setTimeout(()=>{
        const overlay=$('flowerOverlay');
        if(overlay){ overlay.classList.remove('show'); overlay.style.display='none'; }
      },3200);
    };
  }catch(e){
    $('formPage').style.display='none'; $('memoryPage').style.display='block';
    $('memoryPage').innerHTML='<div class="box"><div class="heart">💔</div><h1>الذكرى مش موجودة</h1><p>اتأكد إن رابط الذكرى صحيح.</p></div>';
  }
}

function renderMemoryFlow(data){
  let urls=Array.isArray(data.photo_urls)?data.photo_urls.filter(Boolean):[];
  if(!urls.length&&data.photo_url)urls=[data.photo_url];
  const captions=Array.isArray(data.photo_captions)?data.photo_captions:[];
  $('memoryPage').innerHTML=`<div class="box">
    <section id="page1" class="flow-page active">
      <div class="heart">😍</div>
      <h1>إلى ${escapeHtml(data.name)}</h1>
      <div class="message" id="firstMsg"></div>
      <div class="countdown">
        <div class="count-box"><strong id="cdDays">0</strong><span>يوم</span></div>
        <div class="count-box"><strong id="cdHours">0</strong><span>ساعة</span></div>
        <div class="count-box"><strong id="cdMinutes">0</strong><span>دقيقة</span></div>
        <div class="count-box"><strong id="cdSeconds">0</strong><span>ثانية</span></div>
      </div>
      <div class="music-dock" id="musicDock">
        <div class="record" aria-hidden="true"></div>
        <div class="music-info"><b>ذكرياتنا</b><span>♪ موسيقى الذكرى</span></div>
        <div class="music-note">♪</div>
        <audio id="musicPlayer" controls loop autoplay>
          <source src="https://amrdiab.net/wp-content/uploads/2019/04/wayah.mp3" type="audio/mpeg">
        </audio>
      </div>
      <button class="next-btn" onclick="goPage(2)">التالي ➡️</button>
    </section>
    <section id="page2" class="flow-page">
      <div class="heart">📸</div><h1>ذكرياتنا ❤️</h1>
      <div class="gallery" id="flowGallery"></div>
      <button class="next-btn" onclick="goPage(3)">التالي ➡️</button>
    </section>
    <section id="page3" class="flow-page">
      <div class="heart">💖</div>
      <h1>وأخيرًا... ❤️</h1>
      <div class="message" id="finalMsg"></div>
      <div style="font-size:44px;margin-top:18px">🌹 ❤️ 🌹</div>
    </section>
  </div>`;

  const firstText='😍 '+(data.message||'أجمل ذكرى ❤️');
  const finalText=data.final_message||'❤️';
  $('firstMsg').classList.add('typewriter'); $('finalMsg').classList.add('typewriter');
  function typeWriter(el,text,speed=30){el.textContent='';el.classList.add('typing');let i=0;const tick=()=>{if(i<text.length){el.textContent+=text[i++];setTimeout(tick,speed)}else el.classList.remove('typing')};tick()}
  typeWriter($('firstMsg'),firstText); typeWriter($('finalMsg'),finalText);
  const music=$('musicPlayer'),dock=$('musicDock');
  if(music&&dock){const sync=()=>dock.classList.toggle('playing',!music.paused);music.addEventListener('play',sync);music.addEventListener('pause',sync);music.addEventListener('ended',sync);sync();music.addEventListener('loadedmetadata',()=>{if(music.currentTime<1)music.currentTime=55},{once:true});music.play().catch(()=>{})}

  const gallery=$('flowGallery');
  urls.forEach((url,i)=>{
    const wrap=document.createElement('div');
    wrap.className='photo-wrap';
    const img=document.createElement('img'); img.src=url; img.loading='lazy'; img.alt='صورة ذكرى';
    img.onclick=e=>{e.stopPropagation();openLightbox(urls,i)};
    wrap.appendChild(img);
    if(captions[i]){const p=document.createElement('div');p.className='photo-caption-display';p.textContent=captions[i];wrap.appendChild(p);}
    gallery.appendChild(wrap);
  });

  const baseDate=data.relationship_start||data.first_meeting||data.birthday;
  function tick(){
    if(!baseDate)return;
    const start=new Date(baseDate+'T00:00:00');
    const diff=Math.max(0,Date.now()-start.getTime());
    const sec=Math.floor(diff/1000);
    $('cdDays').textContent=Math.floor(sec/86400);
    $('cdHours').textContent=Math.floor(sec%86400/3600);
    $('cdMinutes').textContent=Math.floor(sec%3600/60);
    $('cdSeconds').textContent=sec%60;
  }
  tick(); setInterval(tick,1000);

  const player=$('musicPlayer');
  const dock=$('musicDock');
  if(player&&dock){const sync=()=>dock.classList.toggle('playing',!player.paused);player.addEventListener('play',sync);player.addEventListener('pause',sync);player.addEventListener('ended',sync);sync();}
  player.addEventListener('loadedmetadata',()=>{player.currentTime=55;player.play().catch(()=>{});},{once:true});
  player.play().catch(()=>{});
}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML;}
window.goPage=function(n){
  document.querySelectorAll('.flow-page').forEach(p=>p.classList.remove('active'));
  const p=document.getElementById('page'+Number(n));
  if(p){ p.classList.add('active'); p.scrollIntoView({behavior:'smooth',block:'start'}); }
};

async function sharePage(){
  const url=location.href;
  try{
    await navigator.clipboard.writeText(url);
    alert('تم نسخ رابط الذكرى 🔗❤️');
  }catch{
    if(navigator.share){try{await navigator.share({title:'ذكرى جميلة ❤️',text:'شوف الذكرى دي 🎂✨',url})}catch{} }
    else alert(url);
  }
}

function createHeart(){
  const h=document.createElement('div');h.className='float';
  h.textContent=['❤️','💖','💕','✨','💗'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'%';
  h.style.animationDuration=(3+Math.random()*4)+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),7000);
}
setInterval(createHeart,700);

window.createMemory=createMemory;
window.sharePage=sharePage;

const pathMatch=location.pathname.match(/^\/m\/([0-9a-f-]{36})\/?$/i);
const queryId=new URLSearchParams(location.search).get('memory');
const memoryId=pathMatch ? pathMatch[1] : queryId;
if(memoryId) loadMemory(memoryId);
</script>
</body>
</html>
