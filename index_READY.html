<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ذكرياتنا ❤️</title>
<style>
*{box-sizing:border-box}
:root{--pink:#c4577d;--deep:#7d3655;--soft:#fff4f8;--line:#f1cad8}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#633c4d}
body{
 min-height:100vh;overflow-x:hidden;
 background:
 radial-gradient(circle at 10% 15%,#fff 0 2px,transparent 3px),
 radial-gradient(circle at 80% 25%,#fff8 0 2px,transparent 3px),
 linear-gradient(135deg,#ffe3ed,#f8c8da 50%,#fff0f5);
 background-size:170px 170px,230px 230px,100% 100%;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,#fff7,transparent 55%);z-index:-1}
.box{position:relative;width:92%;max-width:580px;margin:5vh auto;padding:26px;background:#ffffffd9;border:1px solid #fff;backdrop-filter:blur(14px);border-radius:30px;box-shadow:0 22px 60px #7d365522}
h1{color:var(--deep);margin:10px 0;font-size:28px}
p{color:#81576a}
button,input,textarea{width:100%;font:inherit;border-radius:15px}
button{border:0;padding:14px;background:linear-gradient(135deg,#c85d83,#a9476e);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 10px 24px #a9476e33}
button:disabled{opacity:.6}
input,textarea{border:1px solid var(--line);padding:13px;background:#fff;color:#633c4d;outline:none}
textarea{min-height:105px;resize:vertical}
.field{text-align:right;margin-top:12px}
.field label{display:block;color:var(--deep);font-weight:bold;margin:0 7px 6px}
.emoji{font-size:62px}.heart{font-size:60px;animation:beat 1.1s infinite;text-align:center}
.message{white-space:pre-wrap;line-height:2;font-size:19px;margin:16px 0;color:#653e4e}
.small{font-size:13px;color:#8c6877}
.error{display:none;background:#ffe3e3;color:#8b1e1e;padding:12px;border-radius:13px;margin-top:12px}
.loading{display:none;color:var(--deep);margin-top:12px}
.photo-picker{display:block;margin-top:14px;padding:17px;border:2px dashed #d88eaa;border-radius:20px;background:#fff9fc;color:var(--deep);font-weight:bold;cursor:pointer}
.photo-picker input{display:none}
.photo-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.preview-item{position:relative}
.preview-item img{width:100%;height:110px;object-fit:cover;border-radius:15px;border:3px solid #fff}
.preview-item .remove{position:absolute;right:4px;top:4px;width:30px;height:30px;padding:0;border-radius:50%;background:#fff;color:#a9476e;box-shadow:0 3px 10px #0002}
.caption{margin-top:6px;padding:9px;font-size:13px}
.memory{display:none}
.flow-page{display:none;animation:pageIn .45s ease}
.flow-page.active{display:block}
.next{margin-top:18px}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.counter .unit{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px 4px}
.counter b{display:block;font-size:23px;color:var(--deep)}
.counter span{font-size:11px;color:#936477}
.music{margin:18px 0;padding:13px;background:#fff8;border:1px solid var(--line);border-radius:18px}
audio{width:100%}
.gallery{display:flex;flex-direction:column;gap:20px;margin:20px 0}
.gallery figure{margin:0}
.gallery img{width:100%;max-height:560px;object-fit:cover;border-radius:23px;border:4px solid #fff;box-shadow:0 14px 30px #7d36551c;cursor:zoom-in}
.gallery figcaption{margin:8px 4px 0;padding:10px 13px;background:#fff9;border-radius:15px;line-height:1.7}
.lock{padding-top:5px}
.envelope{font-size:90px;animation:float 2.5s ease-in-out infinite}
.lock input{margin:10px 0}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:300;background:#fff;color:var(--deep);padding:13px 20px;border-radius:30px;box-shadow:0 10px 30px #0002;font-weight:bold}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts span{position:absolute;bottom:-50px;animation:rise linear infinite;opacity:.65}
.flower-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;background:#ffd9eaf5;z-index:250}
.flower-overlay.show{display:flex}
.flower{position:absolute;font-size:clamp(35px,10vw,90px);animation:flowerIn 3s ease forwards}
.flower-center{position:relative;font-size:110px;filter:drop-shadow(0 15px 25px #7d365533);animation:flowerCenter 3s ease forwards}
.lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#160b12ee;z-index:400;padding:18px}
.lightbox.open{display:flex}
.lightbox img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:18px}
.lb{position:absolute;width:46px;height:46px;border-radius:50%;padding:0;background:#fff;color:var(--deep)}
.lb.close{top:18px;right:18px}.lb.prev{left:18px}.lb.next{right:18px}
@keyframes beat{50%{transform:scale(1.12)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.7}to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes flowerIn{0%{transform:scale(.2) rotate(-30deg);opacity:0}20%{opacity:1}75%{opacity:1}100%{transform:translateY(-15px) scale(1.05) rotate(15deg);opacity:0}}
@keyframes flowerCenter{0%{transform:scale(.2);opacity:0}18%{transform:scale(1.1);opacity:1}78%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@media(max-width:430px){.box{padding:21px}.message{font-size:18px}.photo-preview{grid-template-columns:repeat(2,1fr)}.counter b{font-size:20px}}
</style>
</head>
<body>

<div id="hearts" class="hearts"></div>

<section id="createPage" class="box">
  <div class="emoji">💗</div>
  <h1>اعمل ذكرى مميزة</h1>
  <p>اكتب التفاصيل، اختار الصور، وخليها ذكرى خاصة ❤️</p>

  <input id="name" placeholder="اسم الشخص">

  <div class="field"><label>🎂 تاريخ الميلاد</label><input id="date" type="date"></div>
  <div class="field"><label>💕 تاريخ بداية العلاقة</label><input id="relationshipStart" type="date"></div>
  <div class="field"><label>✨ أول يوم اتقابلتوا فيه</label><input id="firstMeeting" type="date"></div>

  <div class="field"><label>💌 الرسالة الأولى</label><textarea id="firstMessage" placeholder="اكتب الكلام اللي هيظهر في أول صفحة..."></textarea></div>
  <div class="field"><label>💖 الرسالة الأخيرة</label><textarea id="finalMessage" placeholder="اكتب كلام النهاية..."></textarea></div>

  <div class="field"><label>🔐 كلمة سر الذكرى</label><input id="memoryPassword" type="password" minlength="4" placeholder="4 أحرف أو أرقام على الأقل"></div>

  <label class="photo-picker">
    📸 إضافة صور للذكرى
    <input id="photo" type="file" accept="image/*" multiple>
  </label>
  <div id="photoCount" class="small">لم يتم اختيار صور بعد 📷</div>
  <div id="photoPreview" class="photo-preview"></div>

  <button id="createBtn" style="margin-top:16px">إنشاء الذكرى ✨</button>
  <div id="error" class="error"></div>
  <div id="loading" class="loading">جاري إنشاء الذكرى... ⏳</div>
</section>

<section id="memoryPage" class="memory"></section>

<div id="flowers" class="flower-overlay">
  <div class="flower-center">🌹</div>
</div>

<div id="lightbox" class="lightbox">
  <button class="lb close" id="lbClose">✕</button>
  <button class="lb prev" id="lbPrev">‹</button>
  <img id="lbImg" src="" alt="صورة مكبرة">
  <button class="lb next" id="lbNext">›</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://vivzjchvymlskwamiqcd.supabase.co';
const SUPABASE_KEY='sb_publishable_sqJWaioZ5ShIonsxEpgA5Q_cYMd3Hyi';
const BUCKET='memory-images';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function errorMsg(msg){$('error').textContent=msg;$('error').style.display='block'}
function clearError(){$('error').style.display='none'}

async function sha256(value){
 const bytes=new TextEncoder().encode(value);
 const hash=await crypto.subtle.digest('SHA-256',bytes);
 return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

let files=[];
$('photo').addEventListener('change',()=>{
 const incoming=[...$('photo').files];
 if(incoming.some(f=>!f.type.startsWith('image/')))return errorMsg('اختار صور فقط.');
 if(files.length+incoming.length>10)return errorMsg('الحد الأقصى 10 صور.');
 if(incoming.some(f=>f.size>5*1024*1024))return errorMsg('كل صورة لازم تكون أقل من 5 ميجابايت.');
 files.push(...incoming); $('photo').value=''; clearError(); renderPreviews();
});

function renderPreviews(){
 $('photoCount').textContent=files.length?`تم اختيار ${files.length} ${files.length===1?'صورة':'صور'} ❤️`:'لم يتم اختيار صور بعد 📷';
 const wrap=$('photoPreview');wrap.innerHTML='';
 files.forEach((file,i)=>{
  const item=document.createElement('div');item.className='preview-item';
  const img=document.createElement('img');img.src=URL.createObjectURL(file);
  const rm=document.createElement('button');rm.className='remove';rm.type='button';rm.textContent='×';
  rm.onclick=()=>{files.splice(i,1);renderPreviews()};
  const cap=document.createElement('input');cap.className='caption';cap.placeholder='كلام مع الصورة ❤️';cap.value=file.caption||'';
  cap.oninput=()=>file.caption=cap.value;
  item.append(img,rm,cap);wrap.appendChild(item);
 });
}

function showFlowers(){
 const overlay=$('flowers');overlay.innerHTML='<div class="flower-center">🌹</div>';
 const list=['🌹','🌷','🌺','🌸','🌹','🌷','🌺','🌸','🌹','🌷','🌸','🌺','🌹','🌸','🌷','🌹','🌺','🌸'];
 list.forEach((f,i)=>{
  const el=document.createElement('span');el.className='flower';el.textContent=f;
  el.style.left=(3+Math.random()*94)+'%';el.style.top=(5+Math.random()*85)+'%';
  el.style.animationDelay=(Math.random()*.8)+'s';overlay.appendChild(el);
 });
 overlay.classList.add('show');
 setTimeout(()=>overlay.classList.remove('show'),3000);
}

function startHearts(){
 const wrap=$('hearts');
 ['❤️','💕','💗','💖','💞','💘'].forEach((h,i)=>{
  for(let j=0;j<4;j++){
   const el=document.createElement('span');el.textContent=h;
   el.style.left=Math.random()*100+'%';el.style.animationDuration=(7+Math.random()*7)+'s';
   el.style.animationDelay=(-Math.random()*10)+'s';el.style.fontSize=(16+Math.random()*18)+'px';
   wrap.appendChild(el);
  }
 });
}
startHearts();

$('createBtn').onclick=createMemory;

async function createMemory(){
 clearError();
 const name=$('name').value.trim();
 const birthday=$('date').value;
 const relationshipStart=$('relationshipStart').value||null;
 const firstMeeting=$('firstMeeting').value||null;
 const firstMessage=$('firstMessage').value.trim();
 const finalMessage=$('finalMessage').value.trim();
 const password=$('memoryPassword').value.trim();

 if(!name||!birthday)return errorMsg('اكتب الاسم وتاريخ الميلاد ❤️');
 if(password.length<4)return errorMsg('كلمة السر لازم تكون 4 أحرف أو أرقام على الأقل 🔐');

 $('createBtn').disabled=true;$('loading').style.display='block';

 try{
  const id=crypto.randomUUID(), photo_urls=[];
  for(let i=0;i<files.length;i++){
   const file=files[i];
   const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';
   const path=`${id}/${String(i+1).padStart(2,'0')}.${ext}`;
   const up=await supabase.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
   if(up.error)throw up.error;
   photo_urls.push(supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
  }

  const row={
   id,name,birthday,relationship_start:relationshipStart,first_meeting:firstMeeting,
   password_hash:await sha256(password),
   message:firstMessage||'😍 أجمل حاجة حصلتلي إنك بقيتي جزء من حياتي ❤️',
   final_message:finalMessage||'وإن شاء الله دي مش نهاية الذكريات… دي بداية لأيام أحلى كتير ❤️',
   photo_urls,photo_captions:files.map(f=>(f.caption||'').trim()),
   photo_url:photo_urls[0]||null
  };
  const ins=await supabase.from('memories').insert(row);
  if(ins.error)throw ins.error;

  // الرابط الجديد يستخدم query حتى لا يعتمد على routing في Vercel.
  const url=`${location.origin}/?memory=${encodeURIComponent(id)}`;
  try{await navigator.clipboard.writeText(url)}catch{}
  location.href=url;
 }catch(e){
  console.error(e);
  errorMsg('حصل خطأ أثناء إنشاء الذكرى. لو ظهر الخطأ تاني ابعتلي صورته.');
 }finally{
  $('createBtn').disabled=false;$('loading').style.display='none';
 }
}

async function loadMemory(id){
 try{
  const res=await supabase.from('memories')
   .select('id,name,birthday,relationship_start,first_meeting,message,final_message,photo_url,photo_urls,photo_captions,password_hash')
   .eq('id',id).single();
  if(res.error||!res.data)throw res.error||new Error('not found');
  $('createPage').style.display='none';
  const page=$('memoryPage');page.style.display='block';
  page.innerHTML=`<div class="box lock">
   <div class="envelope">💌</div>
   <h1>ذكرى خاصة ❤️</h1>
   <p>الذكرى دي مقفولة بكلمة سر</p>
   <input id="unlockPassword" type="password" placeholder="اكتب كلمة السر">
   <button id="unlock">🔓 فتح الذكرى</button>
   <div id="unlockError" class="error"></div>
  </div>`;
  $('unlock').onclick=async()=>{
   const pass=$('unlockPassword').value;
   const hash=await sha256(pass);
   if(hash!==res.data.password_hash){
    $('unlockError').textContent='كلمة السر غير صحيحة ❌';$('unlockError').style.display='block';return;
   }
   renderMemory(res.data);showFlowers();
  };
  $('unlockPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('unlock').click()});
 }catch(e){
  $('createPage').style.display='none';$('memoryPage').style.display='block';
  $('memoryPage').innerHTML='<div class="box"><div class="heart">💔</div><h1>الذكرى مش موجودة</h1><p>الرابط غير صحيح أو الذكرى اتشالت.</p></div>';
 }
}

function renderMemory(data){
 let urls=Array.isArray(data.photo_urls)?data.photo_urls.filter(Boolean):[];
 if(!urls.length&&data.photo_url)urls=[data.photo_url];
 const captions=Array.isArray(data.photo_captions)?data.photo_captions:[];
 const page=$('memoryPage');

 page.innerHTML=`<div class="box">
  <section id="p1" class="flow-page active">
   <div class="heart">😍</div>
   <h1>إلى ${esc(data.name)}</h1>
   <div class="message" id="firstText"></div>
   <div class="counter">
    <div class="unit"><b id="days">0</b><span>يوم</span></div>
    <div class="unit"><b id="hours">0</b><span>ساعة</span></div>
    <div class="unit"><b id="mins">0</b><span>دقيقة</span></div>
    <div class="unit"><b id="secs">0</b><span>ثانية</span></div>
   </div>
   <div class="music"><b>🎵 أغنيتكم</b><audio id="player" controls loop><source src="https://amrdiab.net/wp-content/uploads/2019/04/wayah.mp3" type="audio/mpeg"></audio></div>
   <button class="next">التالي ➡️</button>
  </section>

  <section id="p2" class="flow-page">
   <div class="heart">📸</div><h1>ذكرياتنا ❤️</h1>
   <div id="gallery" class="gallery"></div>
   <button class="next">التالي ➡️</button>
  </section>

  <section id="p3" class="flow-page">
   <div class="heart">💖</div>
   <div class="message" id="finalText"></div>
  </section>
 </div>`;

 $('firstText').textContent='😍 '+(data.message||'أجمل ذكرى ❤️');
 $('finalText').textContent=data.final_message||'❤️';

 const pages=[...page.querySelectorAll('.flow-page')];
 page.querySelectorAll('.next')[0].onclick=()=>go(1);
 page.querySelectorAll('.next')[1].onclick=()=>go(2);
 function go(index){pages.forEach((p,i)=>p.classList.toggle('active',i===index));window.scrollTo({top:0,behavior:'smooth'})}

 const gallery=$('gallery');
 urls.forEach((url,i)=>{
  const fig=document.createElement('figure');
  const img=document.createElement('img');img.src=url;img.alt='ذكرى';img.loading='lazy';img.onclick=()=>openLightbox(urls,i);
  fig.appendChild(img);
  if(captions[i]){const cap=document.createElement('figcaption');cap.textContent=captions[i];fig.appendChild(cap)}
  gallery.appendChild(fig);
 });

 const base=data.relationship_start||data.first_meeting||data.birthday;
 const start=base?new Date(base+'T00:00:00').getTime():Date.now();
 function tick(){
  let sec=Math.max(0,Math.floor((Date.now()-start)/1000));
  $('days').textContent=Math.floor(sec/86400);
  $('hours').textContent=Math.floor(sec%86400/3600);
  $('mins').textContent=Math.floor(sec%3600/60);
  $('secs').textContent=sec%60;
 }
 tick();setInterval(tick,1000);

 const player=$('player');
 player.addEventListener('loadedmetadata',()=>{try{player.currentTime=55}catch{};player.play().catch(()=>{})},{once:true});
 player.play().catch(()=>{});
}

function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}

let lbUrls=[],lbIndex=0;
function openLightbox(urls,i){lbUrls=urls;lbIndex=i;$('lbImg').src=urls[i];$('lightbox').classList.add('open')}
function closeLightbox(){$('lightbox').classList.remove('open');$('lbImg').src=''}
function moveLightbox(n){if(!lbUrls.length)return;lbIndex=(lbIndex+n+lbUrls.length)%lbUrls.length;$('lbImg').src=lbUrls[lbIndex]}
$('lbClose').onclick=closeLightbox;$('lbPrev').onclick=()=>moveLightbox(-1);$('lbNext').onclick=()=>moveLightbox(1);
$('lightbox').onclick=e=>{if(e.target===$('lightbox'))closeLightbox()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')moveLightbox(1);if(e.key==='ArrowRight')moveLightbox(-1)});

const queryId=new URLSearchParams(location.search).get('memory');
if(queryId)loadMemory(queryId);
</script>
</body>
</html>
